<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torpedó</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body>
    <div class="display-container">
        <div class="grid grid-user"></div>
        <div class="grid grid-computer"></div>
    </div>
    <div class="btn-container">
        <div class="btn">
            <button class="action start-btn">Játék indítása</button>
            <button class="action rotate-btn">Hajó forgatása</button>
        </div>
    </div>

    <div class="ship-container">
        <div class="grid-ship">
            <div class="ship sm-container" draggable="true">
                <div id="sm-0"></div>
                <div id="sm-1"></div>
            </div>
            <div class="ship md-container" draggable="true">
                <div id="md-0"></div>
                <div id="md-1"></div>
                <div id="md-2"></div>
            </div>
            <div class="ship md-container" draggable="true">
                <div id="md-0"></div>
                <div id="md-1"></div>
                <div id="md-2"></div>
            </div>
            <div class="ship lg-container" draggable="true">
                <div id="lg-0"></div>
                <div id="lg-1"></div>
                <div id="lg-2"></div>
                <div id="lg-3"></div>
            </div>
            <div class="ship xl-container" draggable="true">
                <div id="xl-0"></div>
                <div id="xl-1"></div>
                <div id="xl-2"></div>
                <div id="xl-3"></div>
                <div id="xl-4"></div>
            </div>
        </div>
    </div>
</body>

</html>
